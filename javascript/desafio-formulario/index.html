<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script type="text/javascript" src="./index.js" defer></script>
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body>
    <div>
      <header>
        <h1>Cadastro de DEVs</h1>
        <p>Complete suas informações</p>
      </header>
      <main>
        <form action="">
          <!-- PERSONAL INFORMATIONS -->
          <section>
            <div>
              <label for="firstName">Nome</label>
              <input
                type="text"
                placeholder="Digite seu nome"
                id="firstName"
                required
              />
            </div>
            <div>
              <label for="lastName">Sobrenome</label>
              <input
                type="text"
                placeholder="Digite seu Sobrenome"
                id="lastName"
                required
              />
            </div>
            <div>
              <label for="email">E-mail</label>
              <input
                type="email"
                placeholder="Digite seu e-mail"
                id="email"
                required
              />
            </div>
          </section>

          <!-- ROLE -->
          <section>
            <h3>De qual lado da aplicação você desenvolve?</h3>
            <ul>
              <li>
                <input
                  type="radio"
                  name="role"
                  id="frontend"
                  value="frontend"
                  required=""
                />
                <label for="frontend">Front-end</label>
              </li>
              <li>
                <input
                  type="radio"
                  name="role"
                  id="backend"
                  value="backend"
                  required=""
                />
                <label for="backend">Back-end</label>
              </li>
              <li>
                <input
                  type="radio"
                  name="role"
                  id="fullstack"
                  value="fullstack"
                  required=""
                />
                <label for="fullstack">Full-Stack</label>
              </li>
            </ul>
          </section>

          <!-- SENIORITY7 -->
          <section>
            <h3>Senioridade</h3>
            <select name="seniority" id="seniority" required>
              <option value="" selected="" disabled="">Selecionar</option>
              <option value="estagiario" selected="" disabled="">
                Estagiário
              </option>
              <option value="junior">Júnior</option>
              <option value="pleno">Pleno</option>
              <option value="senior">Sênior</option>
            </select>
          </section>

          <!-- TECHNOLOGIES -->
          <section>
            <h3>Selecione as tecnologias que utiliza</h3>
            <input type="checkbox" name="techs[]" id="html" value="html" />
            <label for="html">HTML</label>
            <input type="checkbox" name="techs[]" id="css" value="css" />
            <label for="css">CSS</label>
            <input
              type="checkbox"
              name="techs[]"
              id="javascript"
              value="javascript"
            />
            <label for="javascript">Javascript</label>
            <input type="checkbox" name="techs[]" id="php" value="php" />
            <label for="php">PHP</label>
            <input type="checkbox" name="techs[]" id="python" value="python" />
            <label for="python">Python</label>
            <input type="checkbox" name="techs[]" id="java" value="java" />
            <label for="java">Java</label>
            <input type="checkbox" name="techs[]" id="c++" value="c++" />
            <label for="c++">C++</label>
          </section>

          <section>
            <h3>Conte um pouco mais da sua experiência</h3>
            <textarea name="xp" id="xp" rows="6" required></textarea>
          </section>

          <button type="submit">Concluir</button>
        </form>
      </main>
    </div>
  </body>
</html>
